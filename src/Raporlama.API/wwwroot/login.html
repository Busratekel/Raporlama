<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1976d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Raporlar">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/pwa-icon.png">
    <title>Bellona Raporlama — Giriş</title>
    <link rel="stylesheet" href="raporlar/rapor-ortak.css">
    <script src="/pwa.js" defer></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card {
            background: var(--bg-panel, #23272b);
            padding: 36px 32px;
            border-radius: 12px;
            min-width: 320px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,.35);
        }
        .login-card h2 { margin: 0 0 8px; color: var(--text-accent, #00eaff); text-align: center; }
        .login-card p.sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
        .login-card label { display: block; margin-bottom: 6px; font-size: 14px; color: #bfc7d5; }
        .login-card input {
            width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 16px;
            border-radius: 8px; border: 1px solid #444; background: #1a1d21; color: #f5f6fa; font-size: 16px;
        }
        .login-card button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #1976d2; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer;
        }
        .login-card button:hover { background: #1565c0; }
        .login-card button.secondary { background: #444; margin-top: 10px; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .info { color: #7fff7f; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .step { display: none; }
        .step.active { display: block; }
        #otpCode { letter-spacing: 8px; text-align: center; font-size: 24px; }
        .countdown { text-align: center; color: #ffb74d; font-size: 15px; margin-bottom: 12px; font-weight: 600; }
        .countdown.expired { color: #e74c3c; }
        .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📊 Raporlama Girişi</h2>

        <div id="step1" class="step active">
            <label for="userName">Kullanıcı adı</label>
            <input type="text" id="userName" autocomplete="username" placeholder="busra.tekel">
            <label for="password">Şifre</label>
            <input type="password" id="password" autocomplete="current-password">
            <div id="error1" class="error" style="display:none;"></div>
            <button type="button" id="btnLogin">Devam</button>
        </div>

        <div id="stepPhone" class="step">
            <p class="info">İlk girişiniz — SMS doğrulama için cep telefonunuzu girin..</p>
            <label for="cepTelefonu">Cep telefonu</label>
            <input type="tel" id="cepTelefonu" autocomplete="tel" inputmode="tel" placeholder="05xxxxxxxxx">
            <div id="errorPhone" class="error" style="display:none;"></div>
            <button type="button" id="btnSavePhone">Kaydet ve SMS gönder</button>
            <button type="button" class="secondary" id="btnBackPhone">Geri</button>
        </div>

        <div id="step2" class="step">
            <p class="info" id="phoneHint"></p>
            <p class="countdown" id="otpCountdown"></p>
            <label for="otpCode">SMS doğrulama kodu</label>
            <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="000000">
            <div id="error2" class="error" style="display:none;"></div>
            <button type="button" id="btnVerify">Giriş yap</button>
            <button type="button" class="secondary" id="btnResend" style="display:none;">Yeni kod gönder</button>
            <button type="button" class="secondary" id="btnBack">Geri</button>
        </div>
    </div>
    <script>
        let challengeId = null;
        let setupChallengeId = null;
        let countdownTimer = null;
        let resendCooldownTimer = null;
        const RESEND_COOLDOWN_SEC = 30;

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        function stopCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
        }

        function formatCountdown(seconds) {
            if (seconds >= 60) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return m + ':' + String(s).padStart(2, '0');
            }
            return seconds + ' sn';
        }

        function stopResendCooldown() {
            if (resendCooldownTimer) {
                clearInterval(resendCooldownTimer);
                resendCooldownTimer = null;
            }
            document.getElementById('btnResend').disabled = false;
            document.getElementById('btnResend').textContent = 'Yeni kod gönder';
        }

        function startResendCooldown(seconds) {
            stopResendCooldown();
            const btn = document.getElementById('btnResend');
            btn.style.display = 'block';
            let remaining = seconds;
            btn.disabled = true;
            btn.textContent = 'Yeni kod (' + remaining + ' sn)';

            resendCooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    stopResendCooldown();
                    return;
                }
                btn.textContent = 'Yeni kod (' + remaining + ' sn)';
            }, 1000);
        }

        function setResendVisible(visible) {
            const btn = document.getElementById('btnResend');
            btn.style.display = visible ? 'block' : 'none';
            if (!visible) stopResendCooldown();
        }

        function startOtpCountdown(seconds) {
            stopCountdown();
            setResendVisible(false);
            const el = document.getElementById('otpCountdown');
            const btnVerify = document.getElementById('btnVerify');
            let remaining = seconds;
            btnVerify.disabled = false;

            function tick() {
                if (remaining <= 0) {
                    stopCountdown();
                    el.textContent = 'Süre doldu. Kod gelmediyse yeni kod isteyin.';
                    el.classList.add('expired');
                    btnVerify.disabled = true;
                    setResendVisible(true);
                    return;
                }
                el.classList.remove('expired');
                el.textContent = 'Kalan süre: ' + formatCountdown(remaining);
                remaining--;
            }

            tick();
            countdownTimer = setInterval(tick, 1000);
        }

        function goStep(step) {
            if (step !== 2) {
                stopCountdown();
                stopResendCooldown();
                setResendVisible(false);
            }
            document.getElementById('step1').classList.toggle('active', step === 1);
            document.getElementById('stepPhone').classList.toggle('active', step === 'phone');
            document.getElementById('step2').classList.toggle('active', step === 2);
        }

        function goOtpStep(maskedPhone, expiresInSeconds) {
            document.getElementById('phoneHint').textContent =
                'Kod ' + (maskedPhone || 'telefonunuza') + ' numarasına gönderildi.';
            goStep(2);
            document.getElementById('otpCode').value = '';
            showError('error2', '');
            startOtpCountdown(expiresInSeconds || 90);
            document.getElementById('otpCode').focus();
        }

        document.getElementById('btnLogin').onclick = async () => {
            showError('error1', '');
            setupChallengeId = null;
            challengeId = null;
            const userName = document.getElementById('userName').value.trim();
            const password = document.getElementById('password').value;
            if (!userName || !password) {
                showError('error1', 'Kullanıcı adı ve şifre gerekli.');
                return;
            }
            try {
                const r = await fetch('/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ userName, password })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) {
                    showError('error1', data.error || 'Giriş başarısız.');
                    return;
                }
                if (data.requiresPhoneSetup) {
                    setupChallengeId = data.setupChallengeId;
                    document.getElementById('cepTelefonu').value = '';
                    showError('errorPhone', '');
                    goStep('phone');
                    document.getElementById('cepTelefonu').focus();
                    return;
                }
                challengeId = data.challengeId;
                goOtpStep(data.maskedPhone, data.expiresInSeconds);
            } catch (e) {
                showError('error1', 'Sunucuya ulaşılamadı.');
            }
        };

        document.getElementById('btnSavePhone').onclick = async () => {
            showError('errorPhone', '');
            const cepTelefonu = document.getElementById('cepTelefonu').value.trim();
            if (!setupChallengeId || !cepTelefonu) {
                showError('errorPhone', 'Cep telefonu gerekli.');
                return;
            }
            try {
                const r = await fetch('/Auth/setup-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ setupChallengeId, cepTelefonu })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) {
                    showError('errorPhone', data.error || 'Kayıt başarısız.');
                    return;
                }
                setupChallengeId = null;
                challengeId = data.challengeId;
                goOtpStep(data.maskedPhone, data.expiresInSeconds);
            } catch (e) {
                showError('errorPhone', 'Sunucuya ulaşılamadı.');
            }
        };

        document.getElementById('btnVerify').onclick = async () => {
            showError('error2', '');
            if (!challengeId) {
                showError('error2', 'Oturum geçersiz. Geri dönüp tekrar giriş yapın.');
                return;
            }
            const otpCode = document.getElementById('otpCode').value.trim();
            if (!challengeId || otpCode.length < 6) {
                showError('error2', '6 haneli kodu girin.');
                return;
            }
            try {
                const r = await fetch('/Auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ challengeId, otpCode, returnUrl: '/menu.html' })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) {
                    showError('error2', data.error || 'Doğrulama başarısız.');
                    return;
                }
                window.location.href = data.redirectUrl || '/menu.html';
            } catch (e) {
                showError('error2', 'Sunucuya ulaşılamadı.');
            }
        };

        document.getElementById('btnResend').onclick = async () => {
            showError('error2', '');
            if (!challengeId) {
                showError('error2', 'Oturum geçersiz. Geri dönüp tekrar giriş yapın.');
                return;
            }
            try {
                const r = await fetch('/Auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ challengeId })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) {
                    showError('error2', data.error || 'Yeni kod gönderilemedi.');
                    const waitMatch = (data.error || '').match(/(\d+)\s*saniye/);
                    if (waitMatch) startResendCooldown(parseInt(waitMatch[1], 10));
                    return;
                }
                document.getElementById('otpCode').value = '';
                document.getElementById('phoneHint').textContent =
                    'Yeni kod ' + (data.maskedPhone || 'telefonunuza') + ' numarasına gönderildi.';
                startOtpCountdown(data.expiresInSeconds || 90);
                document.getElementById('otpCode').focus();
            } catch (e) {
                showError('error2', 'Sunucuya ulaşılamadı.');
            }
        };

        document.getElementById('btnBackPhone').onclick = () => {
            setupChallengeId = null;
            showError('errorPhone', '');
            goStep(1);
        };

        document.getElementById('btnBack').onclick = () => {
            challengeId = null;
            document.getElementById('otpCode').value = '';
            showError('error2', '');
            goStep(1);
        };
    </script>
</body>
</html>
