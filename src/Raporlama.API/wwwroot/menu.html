<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1976d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Raporlar">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/pwa-icon.png">

    <link rel="stylesheet" href="raporlar/rapor-ortak.css?v=20260818g" />
    <script src="/pwa.js?v=20260818h" defer></script>
    <script src="raporlar/theme.js?v=20260818"></script>
    <script>RaporTheme.init({ dxBase: 'lib/css/' });</script>
    <style>
                .page-header {
                    max-width: 800px;
                    margin: 0 auto 40px;
                    display: flex;
                    flex-wrap: wrap;
                    align-items: flex-start;
                    justify-content: flex-start;
                    gap: 12px;
                }
                .page-header h2 {
                    margin: 0;
                    flex: 1 1 100%;
                    text-align: left;
                }
                .top-buttons,
                .admin-bar {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    justify-content: flex-end;
                    align-items: center;
                }
                .menu-top-right {
                    position: fixed;
                    top: 14px;
                    right: 14px;
                    z-index: 1000;
                    display: flex;
                    flex-direction: column;
                    align-items: flex-end;
                    gap: 14px;
                    max-width: min(440px, calc(100vw - 28px));
                }
                .menu-top-right .admin-bar {
                    margin-top: 4px;
                }
                .menu-top-right .corner-actions {
                    position: static;
                    top: auto;
                    right: auto;
                }
                body.menu-page {
                    padding-top: 20px;
                }
                body.menu-page.has-admin-bar {
                    padding-top: 20px;
                }
                .mini-btn {
                    padding: 5px 11px;
                    font-size: 0.82rem;
                    border-radius: 6px;
                    border: 1px solid rgba(255, 255, 255, 0.15);
                    background: #1565c0;
                    color: #fff;
                    font-weight: 600;
                    letter-spacing: 0.02em;
                    line-height: 1.25;
                    cursor: pointer;
                    transition: background 0.2s, transform 0.15s;
                    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
                }
                .mini-btn:hover {
                    background: #0d47a1;
                    transform: translateY(-1px);
                }
                html[data-theme="light"] .mini-btn {
                    background: #1976d2;
                    border-color: transparent;
                }
                html[data-theme="light"] .mini-btn:hover {
                    background: #1565c0;
                }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        html[data-theme="light"] .user-info h3,
        html[data-theme="light"] h2 {
            color: #1976d2;
        }
        html[data-theme="light"] .report-button {
            color: #1976d2;
            border-color: #1976d2;
        }
        html[data-theme="light"] .report-button:hover {
            background: #1976d2;
            color: #fff;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
        }
        html[data-theme="light"] .loading {
            color: #1976d2;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .user-info {
            background: var(--bg-panel);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .user-info h3 {
            color: var(--text-accent);
            margin: 0 0 6px;
        }
        .user-info p {
            margin: 0;
        }
        .reports-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 0;
        }
        .report-button {
            padding: 24px 20px;
            background: var(--bg-panel);
            color: var(--text-accent);
            font-size: 1.2rem;
            font-weight: 600;
            border: 3px solid var(--text-accent);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .report-button .report-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
            padding: 6px;
        }
        .report-button .report-title {
            line-height: 1.3;
        }
        .report-button:hover .report-logo {
            background: #fff;
        }
        .report-button:hover {
            background: #00eaff;
            color: #181A20;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 234, 255, 0.3);
        }
        .report-button.disabled {
            background: #1a1a1a;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .report-button.disabled:hover {
            transform: none;
            box-shadow: none;
        }
        .loading {
            text-align: center;
            color: #00eaff;
            padding: 40px;
        }
        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 {
            color: var(--text-accent);
            margin: 0 0 8px;
        }
        @media (max-width: 640px) {
            body.menu-page {
                padding: 12px;
                padding-top: 12px;
            }
            body.menu-page.has-admin-bar {
                padding-top: 12px;
            }
            .menu-top-right {
                top: 10px;
                right: 10px;
                gap: 12px;
            }
            .menu-top-right .admin-bar {
                margin-top: 2px;
            }
            .page-header {
                margin-bottom: 6px;
            }
            .page-header h2 {
                font-size: 1.15rem;
                line-height: 1.35;
                margin-bottom: 0;
            }
            .admin-bar {
                gap: 6px;
                width: 100%;
            }
            .admin-bar .mini-btn {
                font-size: 0.72rem;
                padding: 5px 8px;
                flex: 0 1 auto;
                max-width: none;
                white-space: nowrap;
            }
            .reports-container {
                grid-template-columns: 1fr;
            }
            .report-button {
                padding: 18px 16px;
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body class="has-corner-actions menu-page">
    <div class="menu-top-right">
    <div class="corner-actions">
        <button type="button" id="themeToggle" class="corner-btn corner-btn--theme" title="Açık temaya geç" aria-label="Açık temaya geç">☀️</button>
        <div class="inbox-wrap" id="inboxWrap" style="display:none;">
            <button type="button" id="inboxBtn" class="corner-btn corner-btn--notify" title="Bildirimler" aria-label="Bildirimler">🔔</button>
            <span id="inboxBadge" class="inbox-badge" style="display:none;">0</span>
            <div id="inboxPanel" class="inbox-panel" hidden>
                <div class="inbox-panel__header">
                    <span>Bildirimler</span>
                    <div class="inbox-panel__actions">
                        <button type="button" id="inboxMarkAllBtn">Tümünü oku</button>
                        <button type="button" id="inboxCloseBtn">✕</button>
                    </div>
                </div>
                <div id="inboxList" class="inbox-panel__list"></div>
                <div class="inbox-panel__footer" id="inboxSettingsFooter">
                    <label class="inbox-setting-row">
                        <span id="pushEnabledToggleLabel">Bildirimler kapalı</span>
                        <input type="checkbox" id="pushEnabledToggle">
                    </label>
                </div>
            </div>
        </div>
        <button type="button" id="installPwaBtn" class="corner-btn corner-btn--install" style="display:none;" title="Ana ekrana ekle" aria-label="Ana ekrana ekle">📱</button>
        <a href="/Auth/cikis" id="logoutBtn" class="corner-btn corner-btn--logout" style="display:none;" title="Çıkış yap" aria-label="Çıkış yap">🔒</a>
    </div>
    <div class="admin-bar" id="adminBar" style="display:none;">
        <button class="mini-btn" id="adminBtn" style="display:none;" onclick="window.location.href='yetki-yonetimi.html'">🔐 Yetki Yönetimi</button>
        <button class="mini-btn" id="etlBtn" style="display:none;" onclick="window.location.href='etl.html'">⚙️ ETL Yönetimi</button>
    </div>
    </div>
    <div class="container">
        <header class="page-header">
            <h2>📊 Rapor Seçimi</h2>
        </header>
        
        <div id="inboxBanner" class="inbox-banner" style="display:none;"></div>
        <div class="user-info" id="userInfo">
            <div class="loading">Kullanıcı bilgileri yükleniyor...</div>
        </div>

        <div id="reportsContainer" class="reports-container">
            <div class="loading">Raporlar yükleniyor...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        window.onload = async function() {
            const isAuthenticated = await loadUserInfo();
            if (isAuthenticated) {
                await checkAdminAccess();
                await loadReports();
            }
        };

        function isLocalDev() {
            const h = window.location.hostname;
            return h === 'localhost' || h === '127.0.0.1';
        }

        function devLoginUrl(userName) {
            const q = userName ? '?userName=' + encodeURIComponent(userName) : '';
            return window.location.origin + '/Auth/dev-login' + q;
        }
        async function checkAdminAccess() {
            try {
                const resp = await fetch(`${API_BASE}/authorization/is-admin`, { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.isAdmin) {
                        document.getElementById('adminBar').style.display = 'flex';
                        document.getElementById('adminBtn').style.display = 'inline-block';
                        document.getElementById('etlBtn').style.display = 'inline-block';
                        document.body.classList.add('has-admin-bar');
                    }
                }
            } catch (_) { /* ignore */ }
        }
        async function showNotLoggedIn() {
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('inboxWrap').style.display = 'none';
            closeInboxPanel();
            let portalLoginUrl = null;
            let localAuthEnabled = false;
            let isLocalEnvironment = isLocalDev();
            try {
                const resp = await fetch(window.location.origin + '/Auth/login-options', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    portalLoginUrl = data.portalLoginUrl || null;
                    localAuthEnabled = !!data.localAuthEnabled;
                    isLocalEnvironment = !!(data.isLocalEnvironment || data.isDevelopment || isLocalDev());
                }
            } catch (_) { /* ignore */ }

            let intro = '';
            let links = '';

            if (isLocalEnvironment) {
                intro = '<p>Local ortam — SMS giriş akışını test edebilir veya hızlı dev giriş kullanabilirsiniz.</p>';
                if (localAuthEnabled) {
                    links = `<p style="margin-top:12px;"><a href="/login.html" style="color:#7fff7f;font-weight:600;">Kullanıcı adı + SMS ile giriş →</a></p>`;
                } else {
                    links = '<p style="margin-top:12px;color:#ffccbc;">SMS girişi kapalı. appsettings.json içinde <strong>LocalAuth:Enabled</strong> = true yapın.</p>';
                }
                links += `<p style="margin-top:10px;font-size:0.95rem;"><a href="${devLoginUrl('busra.tekel')}" style="color:#ccc;">Dev giriş (atla) →</a></p>`;
            } else if (portalLoginUrl && localAuthEnabled) {
                intro = '<p>Ofis ağında portaldan, dışarıdan SMS ile giriş yapabilirsiniz.</p>';
                links = `
                    <p style="margin-top:12px;"><a href="${escapeHtml(portalLoginUrl)}" style="color:#fff;font-weight:600;">Kurumsal portaldan giriş →</a></p>
                    <p style="margin-top:8px;"><a href="/login.html" style="color:#7fff7f;font-weight:600;">Dış erişim: kullanıcı adı + SMS →</a></p>`;
            } else if (portalLoginUrl) {
                intro = '<p>Raporlara erişmek için kurumsal portaldan giriş yapın.</p>';
                links = `<p style="margin-top:12px;"><a href="${escapeHtml(portalLoginUrl)}" style="color:#fff;font-weight:600;">Portala git ve giriş yap →</a></p>`;
            } else if (localAuthEnabled) {
                intro = '<p>Raporlara erişmek için kullanıcı adı ve SMS doğrulaması ile giriş yapın.</p>';
                links = `<p style="margin-top:12px;"><a href="/login.html" style="color:#7fff7f;font-weight:600;">Giriş yap →</a></p>`;
            } else {
                intro = '<p>Giriş yapılandırması eksik. Sistem yöneticisine başvurun.</p>';
            }

            document.getElementById('userInfo').innerHTML = `
                <div class="error">
                    <h3>⚠️ Giriş Yapılmamış</h3>
                    ${intro}
                    ${links}
                </div>
            `;
            document.getElementById('reportsContainer').innerHTML = `
                <div style="grid-column:1/-1;text-align:center;color:#888;padding:40px;">
                    Rapor listesi için önce giriş yapın.
                </div>`;
        }
        async function loadUserInfo() {
            try {
                const response = await fetch(`${API_BASE}/authorization/current-user`, { credentials: 'include' });
                if (!response.ok) {
                    if (response.status === 401) {
                        await showNotLoggedIn();
                        return false;
                    }
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const userInfo = await response.json();
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                document.getElementById('inboxWrap').style.display = 'inline-flex';
                await refreshInbox();
                document.getElementById('userInfo').innerHTML = `
                    <h3>👤 Kullanıcı Bilgileri</h3>
                    <p><strong>Kullanıcı Adı:</strong> ${escapeHtml(userInfo.userName || 'Bilinmiyor')}</p>`;
                return true;
            } catch (error) {
                document.getElementById('userInfo').innerHTML = `
                    <div class="error">
                        <h3>❌ Hata</h3>
                        <p>Kullanıcı bilgileri yüklenemedi: ${escapeHtml(error.message)}</p>
                        ${isLocalDev() ? `<p><a href="${devLoginUrl('busra.tekel')}" style="color:#7fff7f;">Dev giriş dene →</a></p>` : ''}
                    </div>
                `;
                return false;
            }
        }
        function getReportLogo(report) {
            const code = (report.reportCode || '').toLowerCase();
            const name = (report.reportName || '').toLowerCase();
            const url = (report.url || '').toLowerCase();
            if (code.includes('bekleyen') || name.includes('bekleyen') || url.includes('bekleyen'))
                return 'images/eba.png';
            if (code.includes('qdms') || name.includes('qdms') || url.includes('qdms'))
                return 'images/qdms.png';
            if (code.includes('satinalma') || code.includes('kabuller')
                || name.includes('satinalma') || name.includes('kabuller')
                || name.includes('satınalma') || name.includes('kabul')
                || url.includes('satinalma') || url.includes('kabuller'))
                return 'images/satinalma-kabuller.png';
            if (code.includes('gorev-formu') || code.includes('seyahat')
                || name.includes('görev') || name.includes('gorev') || name.includes('seyahat')
                || url.includes('gorev-formu') || url.includes('seyahat'))
                return 'images/seyahat.png';
            return null;
        }
        function getReportDisplayName(report) {
            const code = (report.reportCode || '').toLowerCase();
            const name = (report.reportName || '').toLowerCase();
            const url = (report.url || '').toLowerCase();
            if (code.includes('bekleyen') || name.includes('bekleyen') || url.includes('bekleyen'))
                return 'EBA Bekleyen Süreçler';
            if (code.includes('satinalma') || code.includes('kabuller')
                || name.includes('satinalma') || name.includes('kabuller')
                || name.includes('satınalma') || url.includes('satinalma-kabuller'))
                return 'Satınalma Kabuller Dökümü';
            if (code.includes('gorev-formu') || code.includes('seyahat')
                || name.includes('görev') || name.includes('gorev') || name.includes('seyahat')
                || url.includes('gorev-formu'))
                return 'Görev Formu Personel Seyahat';
            return report.reportName || 'Rapor';
        }
        function renderReportButton(report, url) {
            const logo = getReportLogo(report);
            const title = escapeHtml(getReportDisplayName(report));
            const logoHtml = logo
                ? `<img class="report-logo" src="${logo}" alt="${title}">`
                : '';
            return `
                <button class="report-button" onclick="checkReportAccess('${report.reportID}', '${url}')">
                    ${logoHtml}
                    <span class="report-title">${title}</span>
                </button>
            `;
        }
        async function loadReports() {
            try {
                const response = await fetch(`${API_BASE}/reports`, { credentials: 'include' });
                if (!response.ok) {
                    if (response.status === 401) {
                        await showNotLoggedIn();
                        return;
                    }
                    if (response.status === 403) throw new Error('Rapor yetkiniz yok. Yetki yönetiminden kullanıcıya rapor atayın.');
                    throw new Error('Raporlar yüklenemedi');
                }
                const reports = await response.json();
                if (!reports || reports.length === 0) {
                    document.getElementById('reportsContainer').innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">
                            Henüz erişebileceğiniz rapor bulunmamaktadır.
                        </div>
                    `;
                    return;
                }
                const reportsHtml = reports
                    .filter(report => report.url && report.url.length > 0)
                    .map(report => renderReportButton(report, normalizeReportUrl(report.url)))
                    .join('');
                document.getElementById('reportsContainer').innerHTML = reportsHtml;
            } catch (error) {
                document.getElementById('reportsContainer').innerHTML = `
                    <div class="error" style="grid-column: 1/-1;">
                        Raporlar yüklenemedi: ${error.message}
                    </div>
                `;
            }
        }
        async function checkReportAccess(reportId, url) {
            try {
                const response = await fetch(`${API_BASE}/authorization/has-access?reportId=${reportId}`, { credentials: 'include' });
                if (!response.ok) throw new Error('Yetki kontrolü başarısız.');
                const result = await response.json();
                if (result.hasAccess) {
                    window.location.href = url;
                } else {
                    alert('Bu rapora erişiminiz bulunmamaktadır. Yetki için IT Departmanına başvurunuz.');
                }
            } catch (error) {
                alert('Yetki kontrolü sırasında hata oluştu: ' + error.message);
            }
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function normalizeReportUrl(raw) {
            if (!raw || !String(raw).trim()) return '/menu.html';
            let url = String(raw).trim().replace(/\\/g, '/');
            if (/^https?:\/\//i.test(url)) return url;
            url = url.replace(/^\/+/, '');
            if (!url.toLowerCase().startsWith('raporlar/')) {
                url = 'raporlar/' + url;
            }
            if (!url.toLowerCase().endsWith('.html')) {
                url += '.html';
            }
            return url;
        }

        function formatNotifTime(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (_) { return ''; }
        }

        function updateInboxBadge(count) {
            const badge = document.getElementById('inboxBadge');
            if (!badge) return;
            if (count > 0) {
                badge.style.display = 'block';
                badge.textContent = count > 99 ? '99+' : String(count);
            } else {
                badge.style.display = 'none';
            }
        }

        function updateInboxBanner(count) {
            const banner = document.getElementById('inboxBanner');
            if (!banner) return;
            if (count > 0) {
                banner.style.display = 'block';
                banner.innerHTML = `<strong>${count}</strong> okunmamış bildiriminiz var — görmek için tıklayın`;
            } else {
                banner.style.display = 'none';
            }
        }

        function renderInboxList(items) {
            const list = document.getElementById('inboxList');
            if (!list) return;
            if (!items || !items.length) {
                list.innerHTML = '<div class="inbox-panel__empty">Bildirim yok</div>';
                return;
            }
            list.innerHTML = items.map(item => `
                <button type="button" class="inbox-item${item.isRead ? '' : ' is-unread'}" data-id="${item.notificationKey}" data-url="${escapeHtml(item.url || '/menu.html')}">
                    <div class="inbox-item__title">${escapeHtml(item.title)}</div>
                    <div class="inbox-item__body">${escapeHtml(item.body)}</div>
                    <div class="inbox-item__time">${formatNotifTime(item.createdAt)}</div>
                </button>`).join('');
            list.querySelectorAll('.inbox-item').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = Number(btn.dataset.id);
                    const url = normalizeReportUrl(btn.dataset.url);
                    await window.RaporPwa?.markNotificationRead(id);
                    closeInboxPanel();
                    await refreshInbox();
                    window.location.href = url;
                });
            });
        }

        function updatePushToggleLabel(enabled) {
            const label = document.getElementById('pushEnabledToggleLabel');
            if (label) {
                label.textContent = enabled ? 'Bildirimler açık' : 'Bildirimler kapalı';
            }
        }

        async function refreshInbox() {
            if (!window.RaporPwa) return;
            const data = await window.RaporPwa.getInbox(30);
            updateInboxBadge(data.unreadCount || 0);
            updateInboxBanner(data.unreadCount || 0);
            renderInboxList(data.items || []);

            const status = await window.RaporPwa.getPushStatus();
            const toggle = document.getElementById('pushEnabledToggle');
            if (toggle) {
                toggle.disabled = !status.enabled || !window.RaporPwa.isPushSupported();
                toggle.checked = !!status.pushNotificationsEnabled;
                updatePushToggleLabel(toggle.checked);
            }
        }

        function openInboxPanel() {
            const panel = document.getElementById('inboxPanel');
            if (panel) panel.hidden = false;
            refreshInbox();
        }

        function closeInboxPanel() {
            const panel = document.getElementById('inboxPanel');
            if (panel) panel.hidden = true;
        }

        function toggleInboxPanel() {
            const panel = document.getElementById('inboxPanel');
            if (!panel) return;
            if (panel.hidden) openInboxPanel();
            else closeInboxPanel();
        }

        function updateInstallButton() {
            const btn = document.getElementById('installPwaBtn');
            if (!btn || !window.RaporPwa) return;
            btn.style.display = window.RaporPwa.canInstall() ? 'inline-flex' : 'none';
        }

        window.addEventListener('rapor-pwa-installable', updateInstallButton);
        window.addEventListener('rapor-pwa-install-changed', updateInstallButton);
        window.addEventListener('rapor-push-changed', refreshInbox);
        window.addEventListener('rapor-inbox-changed', refreshInbox);

        document.getElementById('inboxBtn')?.addEventListener('click', toggleInboxPanel);
        document.getElementById('inboxBanner')?.addEventListener('click', openInboxPanel);
        document.getElementById('inboxCloseBtn')?.addEventListener('click', closeInboxPanel);
        document.getElementById('inboxMarkAllBtn')?.addEventListener('click', async () => {
            await window.RaporPwa?.markAllNotificationsRead();
            await refreshInbox();
        });
        document.getElementById('pushEnabledToggle')?.addEventListener('change', async (e) => {
            const enabled = e.target.checked;
            updatePushToggleLabel(enabled);
            const result = await window.RaporPwa?.setPushNotificationsEnabled(enabled);
            if (result?.error) {
                alert(result.error);
                e.target.checked = !enabled;
                updatePushToggleLabel(e.target.checked);
            }
            await refreshInbox();
        });
        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('inboxWrap');
            if (!wrap || wrap.contains(e.target)) return;
            closeInboxPanel();
        });

        document.getElementById('installPwaBtn')?.addEventListener('click', async () => {
            if (!window.RaporPwa?.canInstall()) return;
            const result = await window.RaporPwa.promptInstall();
            if (result.outcome === 'accepted') {
                document.getElementById('installPwaBtn').style.display = 'none';
            }
        });

        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('installPwaBtn')?.style.setProperty('display', 'none');
        }
    </script>
    <script>RaporTheme.bindToggle();</script>
</body>
</html>
