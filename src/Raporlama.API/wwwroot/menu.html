<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapor Seçimi</title>
    <link rel="stylesheet" href="raporlar/rapor-ortak.css" />
    <script src="raporlar/theme.js"></script>
    <script>RaporTheme.init({ dxBase: 'lib/css/' });</script>
    <style>
                .top-buttons {
                    position: absolute;
                    top: 32px;
                    right: 40px;
                    display: flex;
                    gap: 10px;
                    z-index: 10;
                }
                .mini-btn {
                    padding: 7px 16px;
                    font-size: 1rem;
                    border-radius: 8px;
                    border: none;
                    background: #1976d2;
                    color: #fff;
                    font-weight: 500;
                    cursor: pointer;
                    transition: background 0.2s;
                    box-shadow: 0 2px 8px #0003;
                }
                .mini-btn:hover {
                    background: #1565c0;
                }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        html[data-theme="light"] .user-info h3,
        html[data-theme="light"] h2 {
            color: #1976d2;
        }
        html[data-theme="light"] .report-button {
            color: #1976d2;
            border-color: #1976d2;
        }
        html[data-theme="light"] .report-button:hover {
            background: #1976d2;
            color: #fff;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
        }
        html[data-theme="light"] .loading {
            color: #1976d2;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .user-info {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: var(--text-main);
        }
        .user-info h3 {
            color: var(--text-accent);
            margin-top: 0;
        }
        .user-info p {
            margin: 8px 0;
        }
        .reports-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .report-button {
            padding: 24px 20px;
            background: var(--bg-panel);
            color: var(--text-accent);
            font-size: 1.2rem;
            font-weight: 600;
            border: 3px solid var(--text-accent);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .report-button .report-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
            padding: 6px;
        }
        .report-button .report-title {
            line-height: 1.3;
        }
        .report-button:hover .report-logo {
            background: #fff;
        }
        .report-button:hover {
            background: #00eaff;
            color: #181A20;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 234, 255, 0.3);
        }
        .report-button.disabled {
            background: #1a1a1a;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .report-button.disabled:hover {
            transform: none;
            box-shadow: none;
        }
        .loading {
            text-align: center;
            color: #00eaff;
            padding: 40px;
        }
        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 {
            color: var(--text-accent);
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="top-buttons">
        <button type="button" id="themeToggle" class="theme-toggle">☀️ Açık Tema</button>
        <button class="mini-btn" id="adminBtn" style="display:none;" onclick="window.location.href='yetki-yonetimi.html'">🔐 Yetki Yönetimi</button>
        <button class="mini-btn" id="etlBtn" style="display:none;" onclick="window.location.href='etl.html'">⚙️ ETL Yönetimi</button>
    </div>
    <div class="container">
        <h2>📊 Rapor Seçimi</h2>
        
        <div class="user-info" id="userInfo">
            <div class="loading">Kullanıcı bilgileri yükleniyor...</div>
        </div>

        <div id="reportsContainer" class="reports-container">
            <div class="loading">Raporlar yükleniyor...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        window.onload = async function() {
            const isAuthenticated = await loadUserInfo();
            if (isAuthenticated) {
                await checkAdminAccess();
                await loadReports();
            }
        };

        function isLocalDev() {
            const h = window.location.hostname;
            return h === 'localhost' || h === '127.0.0.1';
        }

        function devLoginUrl(userName) {
            const q = userName ? '?userName=' + encodeURIComponent(userName) : '';
            return window.location.origin + '/Auth/dev-login' + q;
        }
        async function checkAdminAccess() {
            try {
                const resp = await fetch(`${API_BASE}/authorization/is-admin`, { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.isAdmin) {
                        document.getElementById('adminBtn').style.display = 'inline-block';
                        document.getElementById('etlBtn').style.display = 'inline-block';
                    }
                }
            } catch (_) { /* ignore */ }
        }
        async function showNotLoggedIn() {
            let portalLink = '';
            let devLink = '';
            try {
                const portalResp = await fetch(window.location.origin + '/auth/portal-url', { credentials: 'include' });
                if (portalResp.ok) {
                    const data = await portalResp.json();
                    if (data.loginUrl) {
                        portalLink = `<p style="margin-top:12px;"><a href="${escapeHtml(data.loginUrl)}" style="color:#fff;font-weight:600;">Portala git ve giriş yap →</a></p>`;
                    }
                }
            } catch (_) { /* ignore */ }
            if (isLocalDev()) {
                devLink = `
                    <p style="margin-top:16px;padding:12px;background:#1a3a1a;border-radius:8px;">
                        <strong>Local geliştirme:</strong><br>
                        <a href="${devLoginUrl('busra.tekel')}" style="color:#7fff7f;font-weight:600;">Dev giriş (busra.tekel) →</a>
                    </p>`;
            }
            document.getElementById('userInfo').innerHTML = `
                <div class="error">
                    <h3>⚠️ Giriş Yapılmamış</h3>
                    <p>Raporlara erişmek için kurumsal portaldan giriş yapıp <strong>Raporlar</strong> linkine tıklayın.</p>
                    ${portalLink}
                    ${devLink}
                </div>
            `;
            document.getElementById('reportsContainer').innerHTML = `
                <div style="grid-column:1/-1;text-align:center;color:#888;padding:40px;">
                    Rapor listesi için önce giriş yapın.
                </div>`;
        }
        async function loadUserInfo() {
            try {
                const response = await fetch(`${API_BASE}/authorization/current-user`, { credentials: 'include' });
                if (!response.ok) {
                    if (response.status === 401) {
                        await showNotLoggedIn();
                        return false;
                    }
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const userInfo = await response.json();
                document.getElementById('userInfo').innerHTML = `
                    <h3>👤 Kullanıcı Bilgileri</h3>
                    <p><strong>Kullanıcı Adı:</strong> ${escapeHtml(userInfo.userName || 'Bilinmiyor')}</p>
                `;
                return true;
            } catch (error) {
                document.getElementById('userInfo').innerHTML = `
                    <div class="error">
                        <h3>❌ Hata</h3>
                        <p>Kullanıcı bilgileri yüklenemedi: ${escapeHtml(error.message)}</p>
                        ${isLocalDev() ? `<p><a href="${devLoginUrl('busra.tekel')}" style="color:#7fff7f;">Dev giriş dene →</a></p>` : ''}
                    </div>
                `;
                return false;
            }
        }
        function getReportLogo(report) {
            const code = (report.reportCode || '').toLowerCase();
            const name = (report.reportName || '').toLowerCase();
            const url = (report.url || '').toLowerCase();
            if (code.includes('bekleyen') || name.includes('bekleyen') || url.includes('bekleyen'))
                return 'images/eba.png';
            if (code.includes('qdms') || name.includes('qdms') || url.includes('qdms'))
                return 'images/qdms.png';
            if (code.includes('satinalma') || code.includes('kabuller')
                || name.includes('satinalma') || name.includes('kabuller')
                || name.includes('satınalma') || name.includes('kabul')
                || url.includes('satinalma') || url.includes('kabuller'))
                return 'images/satinalma-kabuller.png';
            if (code.includes('gorev-formu') || code.includes('seyahat')
                || name.includes('görev') || name.includes('gorev') || name.includes('seyahat')
                || url.includes('gorev-formu') || url.includes('seyahat'))
                return 'images/seyahat.png';
            return null;
        }
        function getReportDisplayName(report) {
            const code = (report.reportCode || '').toLowerCase();
            const name = (report.reportName || '').toLowerCase();
            const url = (report.url || '').toLowerCase();
            if (code.includes('bekleyen') || name.includes('bekleyen') || url.includes('bekleyen'))
                return 'EBA Bekleyen Süreçler';
            if (code.includes('satinalma') || code.includes('kabuller')
                || name.includes('satinalma') || name.includes('kabuller')
                || name.includes('satınalma') || url.includes('satinalma-kabuller'))
                return 'Satınalma Kabuller Dökümü';
            if (code.includes('gorev-formu') || code.includes('seyahat')
                || name.includes('görev') || name.includes('gorev') || name.includes('seyahat')
                || url.includes('gorev-formu'))
                return 'Görev Formu Personel Seyahat';
            return report.reportName || 'Rapor';
        }
        function renderReportButton(report, url) {
            const logo = getReportLogo(report);
            const title = escapeHtml(getReportDisplayName(report));
            const logoHtml = logo
                ? `<img class="report-logo" src="${logo}" alt="${title}">`
                : '';
            return `
                <button class="report-button" onclick="checkReportAccess('${report.reportID}', '${url}')">
                    ${logoHtml}
                    <span class="report-title">${title}</span>
                </button>
            `;
        }
        async function loadReports() {
            try {
                const response = await fetch(`${API_BASE}/reports`, { credentials: 'include' });
                if (!response.ok) {
                    if (response.status === 401) {
                        await showNotLoggedIn();
                        return;
                    }
                    if (response.status === 403) throw new Error('Rapor yetkiniz yok. Yetki yönetiminden kullanıcıya rapor atayın.');
                    throw new Error('Raporlar yüklenemedi');
                }
                const reports = await response.json();
                if (!reports || reports.length === 0) {
                    document.getElementById('reportsContainer').innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">
                            Henüz erişebileceğiniz rapor bulunmamaktadır.
                        </div>
                    `;
                    return;
                }
                const reportsHtml = reports
                    .filter(report => report.url && report.url.length > 0)
                    .map(report => {
                        let url = report.url;
                        if (!url.startsWith('raporlar/')) {
                            url = 'raporlar/' + url.replace(/^\/+/, '');
                        }
                        if (!url.endsWith('.html')) {
                            url += '.html';
                        }
                        return renderReportButton(report, url);
                    }).join('');
                document.getElementById('reportsContainer').innerHTML = reportsHtml;
            } catch (error) {
                document.getElementById('reportsContainer').innerHTML = `
                    <div class="error" style="grid-column: 1/-1;">
                        Raporlar yüklenemedi: ${error.message}
                    </div>
                `;
            }
        }
        async function checkReportAccess(reportId, url) {
            try {
                const response = await fetch(`${API_BASE}/authorization/has-access?reportId=${reportId}`, { credentials: 'include' });
                if (!response.ok) throw new Error('Yetki kontrolü başarısız.');
                const result = await response.json();
                if (result.hasAccess) {
                    window.location.href = url;
                } else {
                    alert('Bu rapora erişiminiz bulunmamaktadır. Yetki için IT Departmanına başvurunuz.');
                }
            } catch (error) {
                alert('Yetki kontrolü sırasında hata oluştu: ' + error.message);
            }
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    <script>RaporTheme.bindToggle();</script>
</body>
</html>
